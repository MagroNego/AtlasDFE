name: CI Atlas DFE

on:
  pull_request:
  push:
    branches: [main, refactor/arquitetura-oculus]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: atlas_test_ci
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas_test_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      ConnectionStrings__Database: Host=127.0.0.1;Database=atlas_test_ci;Username=atlas;Password=atlas_ci_only
      ATLAS_TEST_DATABASE: Host=127.0.0.1;Database=atlas_test_ci;Username=atlas;Password=atlas_ci_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore --locked-mode
      - run: dotnet restore tests/Atlas.Sefaz.Checks --locked-mode
      - run: dotnet build --no-restore
      - run: dotnet run --project backend/Atlas.Api --no-build -- --migrate
      - run: dotnet run --project tests/Atlas.Sefaz.Checks --no-restore
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
