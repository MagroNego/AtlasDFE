name: Release Atlas DFE

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  package:
    name: Publicar pacote Docker Compose
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Montar e validar o pacote
        run: |
          set -euo pipefail
          git archive --format=zip --prefix=AtlasDFE/ HEAD -- \
            README.md docs/migracao-oculus.md RELEASE_NOTES.md .dockerignore .gitignore \
            docker-compose.yml Atlas.slnx Directory.Build.props global.json backend frontend infra secrets/.gitkeep \
            > "AtlasDFE-${GITHUB_REF_NAME}.zip"
          unzip -q "AtlasDFE-${GITHUB_REF_NAME}.zip" -d package
          cd package/AtlasDFE
          docker compose config -q
          docker compose build api frontend
          cd ../..
          sha256sum "AtlasDFE-${GITHUB_REF_NAME}.zip" > "AtlasDFE-${GITHUB_REF_NAME}.zip.sha256"
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "AtlasDFE-${GITHUB_REF_NAME}.zip" \
            "AtlasDFE-${GITHUB_REF_NAME}.zip.sha256" --verify-tag --generate-notes
