{% macro cce_action(numero, serie, chave, cartas) %}
            {% if cartas %}
            <button type="button" class="xml-icon-action cce-open" data-cce-open aria-haspopup="dialog" aria-controls="cce-dialog" title="Consultar Carta de Correção" aria-label="Consultar Carta de Correção da nota {{ numero }}">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5M14 3v6h6M14 3l6 6M9 16l1-4 7-7 3 3-7 7-4 1Z"/></svg>
            </button>
            <template data-cce-content>
              {% for carta in cartas %}
              <section class="cce-entry">
              <dl class="cce-metadata"><div><dt>Nota fiscal</dt><dd>{{ numero }} · Série {{ serie }}</dd></div><div><dt>Sequência</dt><dd>{{ carta.sequencia or 'Não informada' }}</dd></div><div><dt>Registrada em</dt><dd>{{ carta.data_label }}</dd></div><div><dt>Protocolo</dt><dd class="mono">{{ carta.protocolo or 'Não informado' }}</dd></div></dl>
              <h3>Texto da correção</h3>
              <p class="cce-text">{{ carta.correcao or 'O resumo recebido não contém o texto da correção. Importe o XML processado da CC-e para consultá-lo.' }}</p>
              </section>
              {% endfor %}
              <div class="cce-key"><span>Chave NF-e</span><p class="mono">{{ chave }}</p></div>
            </template>
            {% endif %}
{% endmacro %}
